name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Step 1: lint, typecheck, unit tests (no database needed) ─────────────
  lint-typecheck-test:
    runs-on: ubuntu-latest

    env:
      # Placeholder values — these steps don't connect to any real service.
      # lib/env.ts validates presence at import time; the actual values are
      # never used during lint / typecheck / pure unit tests.
      DATABASE_URL: "postgresql://user:password@localhost:5432/ci_placeholder"
      BETTER_AUTH_SECRET: "ci-placeholder-secret-not-real-32chars"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      CLOUDINARY_CLOUD_NAME: "ci-placeholder"
      CLOUDINARY_API_KEY: "000000000000000"
      CLOUDINARY_API_SECRET: "ci-placeholder-secret"
      NODE_ENV: "test"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

  # ── Step 2: production build (requires a real reachable Postgres) ─────────
  build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test   # only run if lint/test pass

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hris
          POSTGRES_PASSWORD: hris_ci_pw
          POSTGRES_DB: siko_mendo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hris"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: "postgresql://hris:hris_ci_pw@localhost:5432/siko_mendo_ci?schema=public"
      BETTER_AUTH_SECRET: "ci-build-secret-at-least-32-chars-long"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      CLOUDINARY_CLOUD_NAME: "ci-placeholder"
      CLOUDINARY_API_KEY: "000000000000000"
      CLOUDINARY_API_SECRET: "ci-placeholder-secret"
      NODE_ENV: "production"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -U hris; do
            echo "Waiting for Postgres…"
            sleep 1
          done

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Production build
        run: npm run build
